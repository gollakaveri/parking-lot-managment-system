
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Update Record</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">PARK<span>LOT</span></div>
    <nav>
        <a href="/">Dashboard</a>
        <a href="list.html?type=people">People</a>
        <a href="list.html?type=slots">Parking Slots</a>
        <a href="list.html?type=vehicles">Vehicles</a>
        <a href="list.html?type=records">Parking Records</a>
    </nav>
</header>

<main class="container narrow">
    <p class="eyebrow">EDIT DETAILS</p>
    <h1 id="heading">Update Record</h1>

    <form id="dataForm" class="form-card">
        Loading record...
    </form>

    <p class="back">
        <a id="backLink" href="/">← Back</a>
    </p>
</main>

<footer>Parking Lot Management System</footer>

<script src="common.js"></script>
<script>
const type = getType();
const id = new URLSearchParams(location.search).get("id");

document.getElementById("heading").textContent =
    "Update " + labels[type];

document.getElementById("backLink").href =
    "list.html?type=" + type;

(async () => {
    if (!id) throw Error("Record ID is missing");

    const row = await api(
        "/api/" + type + "/" + encodeURIComponent(id)
    );

    document.getElementById("dataForm").innerHTML =
        await formFields(type, row) +
        '<button class="btn primary" type="submit">Update Record</button>';

    // Do not allow changing the primary ID while editing
    const primaryInput = document.querySelector(
        `[name="${primaryKeys[type]}"]`
    );

    if (primaryInput) {
        primaryInput.readOnly = true;
    }
})().catch(e => showError(e.message));

document.getElementById("dataForm").addEventListener("submit", async e => {
    e.preventDefault();

    try {
        const data = readForm(e.target);

        await api(
            "/api/" + type + "/" + encodeURIComponent(id),
            {
                method: "PUT",
                body: JSON.stringify(data)
            }
        );

        alert("Record updated successfully!");

        location.href = "list.html?type=" + type;

    } catch (err) {
        alert(err.message);
    }
});
</script>

</body>
</html>
